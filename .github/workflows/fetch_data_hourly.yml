name: Hourly Data Fetch

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pandas python-dotenv hopsworks pyarrow confluent-kafka

      - name: Run hourly fetch script
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
        run: |
          python src/fetch_current_data.py

      - name: Commit local backups
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/raw_backup/aqi_raw_hourly_live.csv 2>/dev/null || true
          git add data/raw_backup/pending_upload.csv 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update local data backups"
          git pull --rebase origin main
          git push